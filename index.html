<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Solar System / 태양계</title>
  <meta name="description" content="An interactive, bilingual (English/Korean) solar system page for elementary students." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🪐</text></svg>" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header class="page-header">
    <h1>🪐 The Solar System <span class="ko">태양계</span></h1>
    <p class="subtitle">Click a planet to learn about it! &nbsp;·&nbsp; 행성을 눌러 보세요!</p>
    <button id="toggle-motion" class="motion-btn" type="button" aria-pressed="false">
      ⏸️ Pause orbits <span class="ko">멈추기</span>
    </button>
  </header>

  <main>
    <!-- Solar system: Sun in the center, planets orbit in rings -->
    <section class="solar-system" id="solar-system" aria-label="Solar system map">
      <button class="sun" id="sun" type="button" aria-label="The Sun / 태양">
        <span class="body-emoji">☀️</span>
      </button>
      <!-- Orbits + planets are generated by script.js -->
    </section>
  </main>

  <!-- Details dialog -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="details" id="details" role="dialog" aria-modal="true" aria-labelledby="details-name" hidden>
    <button class="close-btn" id="close-details" type="button" aria-label="Close / 닫기">✕</button>
    <div class="details-emoji" id="details-emoji">🪐</div>
    <h2 id="details-name">Planet</h2>
    <p class="details-name-ko" id="details-name-ko">행성</p>
    <ul class="facts" id="details-facts"></ul>
  </aside>

  <footer class="page-footer">
    <p>Made for our class 🌟 우리 반을 위해 만들었어요</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
